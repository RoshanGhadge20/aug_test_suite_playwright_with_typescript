name: Playwright customer Automation (Docker)

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Playwright Project"
        required: true
        default: "customer"
        type: choice
        options:
          - customer
          - admin
          - business
          - new-admin

      folder:
        description: "Folder (Optional)"
        required: false
        default: ""

      testcase:
        description: "Test file (Optional)"
        required: false
        default: ""

      send_email:
        description: "Send Email Report?"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      # Create runtime .env file
      - name: Create .env
        run: |
          cat << 'EOF' > .env
          ${{ secrets.DOT_ENV }}
          EOF

      # Build Docker image
      - name: Build Docker Image
        run: docker build -t augmont-playwright . 

      # Run tests
      - name: Run Playwright Tests
        run: |
          CMD="npx playwright test --project=${{ github.event.inputs.project }}"

          if [ -n "${{ github.event.inputs.folder }}" ]; then
            CMD="$CMD tests/${{ github.event.inputs.project }}/${{ github.event.inputs.folder }}"
          fi

          if [ -n "${{ github.event.inputs.testcase }}" ]; then
            CMD="$CMD/${{ github.event.inputs.testcase }}"
          fi

          echo "Running: $CMD"

          docker run --rm \
            --ipc=host \
            --env-file .env \
            -v "${{ github.workspace }}/reports:/app/reports" \
            -v "${{ github.workspace }}/storage:/app/storage" \
            augmont-playwright \
            bash -c "$CMD"

      # Upload HTML Report
      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: reports/html
          retention-days: 30

      # Upload JSON Results
      - name: Upload JSON Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: reports/results.json
          retention-days: 30

      # Generate summary
      - name: Generate Report Summary
        if: always()
        run: node .github/scripts/report-summary.js

      # Build email HTML
      - name: Build HTML Email
        if: always()
        run: node .github/scripts/build-email.js
        env:
          PROJECT: ${{ github.event.inputs.project }}
          FOLDER: ${{ github.event.inputs.folder }}
          TESTCASE: ${{ github.event.inputs.testcase }}

      # Zip report
      - name: Zip HTML Report
        if: always()
        run: |
          if [ -d reports/html ]; then
            cd reports
            zip -r html-report.zip html
            cd ..
          else
            echo "reports/html not found"
          fi

      # Create email env file (ONLY if enabled)
      - name: Create Email Environment File
        if: github.event.inputs.send_email == 'true'
        run: |
          cat << 'EOF' > .env.email
          ${{ secrets.EMAIL_ENV }}
          EOF

      # Send email (ONLY if enabled)
      - name: Send Email
        if: github.event.inputs.send_email == 'true'
        run: node .github/scripts/send-email.js