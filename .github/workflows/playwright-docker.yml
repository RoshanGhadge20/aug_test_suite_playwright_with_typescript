name: Playwright Automation (Docker)

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Playwright Project"
        required: true
        default: "customer"
        type: choice
        options:
          - customer
          - admin
          - business
          - new-admin

      folder:
        description: "Folder (leave blank for all tests)"
        required: false
        default: ""

      testcase:
        description: "Specific test file (optional)"
        required: false
        default: ""

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Create .env
        run: |
          cat << 'EOF' > .env
          ${{ secrets.DOT_ENV }}
          EOF

      - name: Build Docker Image
        run: docker build -t augmont-playwright .

      - name: Run Playwright Tests
        run: |
          CMD="npx playwright test --project=${{ github.event.inputs.project }}"

          if [ -n "${{ github.event.inputs.folder }}" ]; then
            CMD="$CMD tests/${{ github.event.inputs.project }}/${{ github.event.inputs.folder }}"
          fi

          if [ -n "${{ github.event.inputs.testcase }}" ]; then
            CMD="$CMD/${{ github.event.inputs.testcase }}"
          fi

          echo "Executing: $CMD"

          docker run --rm \
            --ipc=host \
            --env-file .env \
            -v "${{ github.workspace }}/reports:/app/reports" \
            -v "${{ github.workspace }}/storage:/app/storage" \
            augmont-playwright \
            bash -c "$CMD"

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports