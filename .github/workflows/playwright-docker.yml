name: Playwright Automation (Docker)

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Playwright Project"
        required: true
        default: "customer"
        type: choice
        options:
          - customer
          - admin

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create .env
        run: |
          cat << 'EOF' > .env
          ${{ secrets.DOT_ENV }}
          EOF

      - name: Verify .env
        run: |
          test -f .env
          echo ".env created successfully"

      - name: Build Docker Image
        run: |
          docker build -t augmont-playwright .

      - name: Run Playwright Tests
        run: |
          docker run --rm \
            --ipc=host \
            --env-file .env \
            -v "${{ github.workspace }}/playwright-report:/app/playwright-report" \
            -v "${{ github.workspace }}/test-results:/app/test-results" \
            augmont-playwright \
            npx playwright test --project=${{ github.event.inputs.project }}

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 30

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          retention-days: 30