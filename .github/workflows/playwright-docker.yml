name: Playwright customer Automation (Docker)

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Playwright Project"
        required: true
        default: "customer"
        type: choice
        options:
          - customer
          - admin
          - business
          - new-admin

      folder:
        description: "Folder (Optional — leave blank to auto-run every folder under tests/<project>, one after another)"
        required: false
        default: ""

      testcase:
        description: "Test file (Optional)"
        required: false
        default: ""

      send_email:
        description: "Send Email Report?"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

      email_to:
        description: "Email recipient(s), comma-separated (optional, defaults to EMAIL_TO in the EMAIL_ENV secret)"
        required: false
        default: ""

jobs:
  # Builds the Docker image once and hands it to every per-folder job below as an artifact —
  # avoids rebuilding the same image once per folder when looping.
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t augmont-playwright .

      - name: Save Docker Image
        run: docker save augmont-playwright -o augmont-playwright.tar

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: augmont-playwright.tar
          retention-days: 1

  # Resolves the list of folders this run should loop over: just the one requested via the
  # `folder` input, or (if left blank) every folder under tests/<project> — auto-discovered so
  # a single trigger fans out into one start-to-end cycle per folder without manual re-runs.
  discover-folders:
    runs-on: ubuntu-latest
    outputs:
      folders: ${{ steps.list.outputs.folders }}
    steps:
      - uses: actions/checkout@v4

      - id: list
        run: |
          if [ -n "${{ github.event.inputs.folder }}" ]; then
            FOLDERS=$(printf '["%s"]' "${{ github.event.inputs.folder }}")
          else
            FOLDERS=$(ls tests/${{ github.event.inputs.project }} | jq -R -s -c 'split("\n")[:-1]')
          fi
          echo "folders=$FOLDERS" >> "$GITHUB_OUTPUT"
          echo "Discovered folders: $FOLDERS"

  playwright:
    needs: [build-image, discover-folders]
    strategy:
      fail-fast: false
      # Sequential — each folder's run visibly starts and ends before the next one begins,
      # same as triggering the workflow manually once per folder. Raise this (or drop it) to
      # run folders concurrently instead.
      max-parallel: 1
      matrix:
        folder: ${{ fromJson(needs.discover-folders.outputs.folders) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      # Node deps for the host-side report/email scripts below (report-summary.js,
      # build-email.js, send-email.js run directly on this runner, NOT inside Docker —
      # the Dockerfile's `npm ci` only installs into the container's own filesystem).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install host dependencies
        run: npm ci --omit=dev

      # Create runtime .env file
      - name: Create .env
        run: |
          cat << 'EOF' > .env
          ${{ secrets.DOT_ENV }}
          EOF

      # Load the Docker image built once in build-image, instead of rebuilding per folder.
      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker Image
        run: docker load -i augmont-playwright.tar

      # Run tests for this matrix folder
      - name: Run Playwright Tests
        run: |
          CMD="npx playwright test --project=${{ github.event.inputs.project }}"
          CMD="$CMD tests/${{ github.event.inputs.project }}/${{ matrix.folder }}"

          if [ -n "${{ github.event.inputs.testcase }}" ]; then
            CMD="$CMD/${{ github.event.inputs.testcase }}"
          fi

          echo "Running: $CMD"

          docker run --rm \
            --ipc=host \
            --env-file .env \
            -v "${{ github.workspace }}/reports:/app/reports" \
            -v "${{ github.workspace }}/storage:/app/storage" \
            augmont-playwright \
            bash -c "$CMD"

      # Upload HTML Report (per-folder name — artifact names must be unique within a run)
      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report-${{ matrix.folder }}
          path: reports/html
          retention-days: 30

      # Upload JSON Results
      - name: Upload JSON Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.folder }}
          path: reports/results.json
          retention-days: 30

      # Generate summary
      - name: Generate Report Summary
        if: always()
        run: node .github/scripts/report-summary.js

      # Build email HTML
      - name: Build HTML Email
        if: always()
        run: node .github/scripts/build-email.js
        env:
          PROJECT: ${{ github.event.inputs.project }}
          FOLDER: ${{ matrix.folder }}
          TESTCASE: ${{ github.event.inputs.testcase }}

      # Zip report
      - name: Zip HTML Report
        if: always()
        run: |
          if [ -d reports/html ]; then
            cd reports
            zip -r html-report.zip html
            cd ..
          else
            echo "reports/html not found"
          fi

      # Create email env file (ONLY if enabled)
      - name: Create Email Environment File
        if: github.event.inputs.send_email == 'true'
        run: |
          cat << 'EOF' > .env.email
          ${{ secrets.EMAIL_ENV }}
          EOF

      # Send email (ONLY if enabled) — one email per folder, matching this folder's summary/report.
      - name: Send Email
        if: github.event.inputs.send_email == 'true'
        run: |
          if [ -n "${{ github.event.inputs.email_to }}" ]; then
            export EMAIL_TO="${{ github.event.inputs.email_to }}"
          fi
          node .github/scripts/send-email.js
