name: Playwright Automation

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Playwright Project"
        required: true
        default: "customer"
        type: choice
        options:
          - customer
          - admin
          - business
          - new-admin
          - api-backend
          - api-emi

      folder:
        description: "Folder path (Leave blank to run complete project)"
        required: false
        default: ""

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Create .env
        run: |
          cat << 'EOF' > .env
          ${{ secrets.DOT_ENV }}
          EOF

      - name: Verify .env
        run: |
          test -f .env && echo ".env created successfully"

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        env:
          CI: true
          HEADLESS: "true"
        shell: bash
        run: |
          CMD="npx playwright test"

          if [ -n "${{ github.event.inputs.folder }}" ]; then
            CMD="$CMD ${{ github.event.inputs.folder }}"
          fi

          CMD="$CMD --project=${{ github.event.inputs.project }}"

          echo "Executing: $CMD"
          eval "$CMD"

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: reports/html

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: reports/test-artifacts

      - name: Upload JSON Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-json
          path: reports/results.json