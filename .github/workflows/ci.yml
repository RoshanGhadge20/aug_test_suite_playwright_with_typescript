name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit tests + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t augmont-test-suite:ci .

  regression:
    name: Playwright regression (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t augmont-test-suite:ci .
      - name: Run regression
        env:
          TARGET_ENV: test
          TEST_BASE_URL_ADMIN: ${{ secrets.TEST_BASE_URL_ADMIN }}
          TEST_BASE_URL_CUSTOMER: ${{ secrets.TEST_BASE_URL_CUSTOMER }}
          TEST_BASE_URL_BUSINESS: ${{ secrets.TEST_BASE_URL_BUSINESS }}
          TEST_BASE_URL_NEW_ADMIN: ${{ secrets.TEST_BASE_URL_NEW_ADMIN }}
          TEST_BASE_URL_BACKEND: ${{ secrets.TEST_BASE_URL_BACKEND }}
          TEST_BASE_URL_EMI: ${{ secrets.TEST_BASE_URL_EMI }}
          TEST_ADMIN_USER_MOBILE: ${{ secrets.TEST_ADMIN_USER_MOBILE }}
          TEST_ADMIN_USER_OTP: ${{ secrets.TEST_ADMIN_USER_OTP }}
          TEST_CUSTOMER_USER_MOBILE: ${{ secrets.TEST_CUSTOMER_USER_MOBILE }}
          TEST_CUSTOMER_USER_OTP: ${{ secrets.TEST_CUSTOMER_USER_OTP }}
          TEST_BUSINESS_USER_MOBILE: ${{ secrets.TEST_BUSINESS_USER_MOBILE }}
          TEST_BUSINESS_USER_OTP: ${{ secrets.TEST_BUSINESS_USER_OTP }}
          TEST_NEW_ADMIN_USER_MOBILE: ${{ secrets.TEST_NEW_ADMIN_USER_MOBILE }}
          TEST_NEW_ADMIN_USER_OTP: ${{ secrets.TEST_NEW_ADMIN_USER_OTP }}
          TEST_BACKEND_USER_MOBILE: ${{ secrets.TEST_BACKEND_USER_MOBILE }}
          TEST_BACKEND_USER_OTP: ${{ secrets.TEST_BACKEND_USER_OTP }}
          TEST_EMI_USER_MOBILE: ${{ secrets.TEST_EMI_USER_MOBILE }}
          TEST_EMI_USER_OTP: ${{ secrets.TEST_EMI_USER_OTP }}
          API_KEY: regression-ci
        run: |
          docker run --rm \
            -e TARGET_ENV \
            -e TEST_BASE_URL_ADMIN -e TEST_BASE_URL_CUSTOMER -e TEST_BASE_URL_BUSINESS -e TEST_BASE_URL_NEW_ADMIN \
            -e TEST_BASE_URL_BACKEND -e TEST_BASE_URL_EMI \
            -e TEST_ADMIN_USER_MOBILE -e TEST_ADMIN_USER_OTP \
            -e TEST_CUSTOMER_USER_MOBILE -e TEST_CUSTOMER_USER_OTP \
            -e TEST_BUSINESS_USER_MOBILE -e TEST_BUSINESS_USER_OTP \
            -e TEST_NEW_ADMIN_USER_MOBILE -e TEST_NEW_ADMIN_USER_OTP \
            -e TEST_BACKEND_USER_MOBILE -e TEST_BACKEND_USER_OTP \
            -e TEST_EMI_USER_MOBILE -e TEST_EMI_USER_OTP \
            -e API_KEY -e HEADLESS=true -e CI=true \
            -v "$GITHUB_WORKSPACE/reports:/app/reports" \
            augmont-test-suite:ci \
            npx playwright test
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: reports/
